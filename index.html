<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxView</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config untuk menyamakan warna dengan referensi desain -->
  <script>
    if (localStorage.getItem('proxview_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            proxviewdark: '#0f172a',
            proxviewcard: '#1e293b',
            proxviewgreen: '#10b981',
          }
        }
      }
    }
  </script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes slide-in {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-in {
      animation: slide-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes bounce-in {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-bounce-in {
      animation: bounce-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 font-sans antialiased">
  
  <!-- Vue Root Element -->
  <div id="app"></div>

  <!-- Vite secara otomatis akan mendeteksi dan mengonversi rute ini saat production build -->
  <script type="module" src="/src/frontend/main.js"></script>
  
</body>
</html>
